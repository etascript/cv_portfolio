name: sebastian-cortes-cv-local

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sebastian-cortes-api-local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8003
      HOST: 0.0.0.0
      DATABASE_URL: /data/sebastian_cortes.sqlite
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sebastian-cortes.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8002}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8002}
      UPLOAD_DIR: /uploads
    volumes:
      - sebastian_cortes_sqlite_local:/data
      - sebastian_cortes_uploads_local:/uploads
    ports:
      - "8003:8003"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sebastian-cortes-web-local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_BASE_URL: /api
    ports:
      - "8002:8002"
    depends_on:
      - api

volumes:
  sebastian_cortes_sqlite_local:
  sebastian_cortes_uploads_local:
