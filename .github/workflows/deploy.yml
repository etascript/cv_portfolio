name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: verify
    environment: production

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VM_PORT || '22' }}" "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VM_PORT || '22' }}" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" << 'EOF'
            set -euo pipefail

            cd "${{ secrets.VM_PROJECT_PATH }}"
            git fetch origin main
            git reset --hard origin/main

            docker compose build --pull api web
            docker compose up -d --remove-orphans

            docker compose ps
            docker compose logs --tail=80 api
          EOF
