name: Deploy CV Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || (echo "Missing repository secret: VPS_HOST" && exit 1)
          test -n "$VPS_USER" || (echo "Missing repository secret: VPS_USER" && exit 1)
          test -n "$VPS_SSH_KEY" || (echo "Missing repository secret: VPS_SSH_KEY" && exit 1)

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /srv/apps/personal/portfolio

            git fetch origin main
            git reset --hard origin/main

            docker compose up -d --build

            docker compose ps
