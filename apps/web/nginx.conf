server {
  listen 8002;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8003/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads/ {
    proxy_pass http://api:8003/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /sitemap.xml {
    proxy_pass http://api:8003/sitemap.xml;
    proxy_set_header Host $host;
  }

  location = /robots.txt {
    proxy_pass http://api:8003/robots.txt;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
